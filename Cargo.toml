[package]
name = "hacp-skill"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Two coding agents, one shared project, explicit agreements and cross-verification"
repository = "https://github.com/manvendersingh21/hacp-skill"

[[bin]]
name = "hacp"
path = "src/main.rs"

[dependencies]
hacp = { version = "1.1.1", git = "https://github.com/manvendersingh21/hacp.git", rev = "3c6498a1bf256f773da338cc0bff61646ea0b2ea" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
